<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>经营数据问答 Agent</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>经营数据问答 Agent</h1>
            <button id="new-chat" type="button">新对话</button>
        </header>
        <section id="query-history" aria-label="对话历史"></section>
        <form id="query-form">
            <label for="question">经营数据问题</label>
            <textarea id="question" rows="3" required
                      placeholder="例如：10 月华东区出库及时率是多少？"></textarea>
            <button id="submit-question" type="submit">提问</button>
        </form>
        <p id="query-status" role="status"></p>
    </main>
    <template id="turn-template">
        <article class="turn">
            <h2 class="turn-question"></h2>
            <p class="turn-answer"></p>
            <div class="turn-result" hidden><table></table></div>
            <details class="turn-sql" hidden>
                <summary>查看实际执行的 SQL</summary>
                <pre></pre>
            </details>
            <details class="turn-trace" hidden>
                <summary>查看调用记录</summary>
                <pre></pre>
            </details>
        </article>
    </template>
</body>
</html>
